<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LilyCao 生日快乐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Long+Cang&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  :root {
    --ink: #4a2a3e;
    --paper: #fdf6e3;
    --pink: #ff8aaf;
    --pink-deep: #b8336a;
    --purple: #c8a2c8;
    --gold: #e8b339;
    --mint: #88c9a1;
    --sky: #8ecae6;
    --orange: #ff9e57;
    --night: #1a1336;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", "Microsoft YaHei", serif;
    color: var(--ink);
    /* 默认夜色渐变（黑色阶段会被黑色 overlay 盖住）—— 暖黄主调 + 一点粉色 */
    background: linear-gradient(180deg, #2a1a10 0%, #4a2a14 25%, #6a3a14 50%, #8a5a24 70%, #b0744a 88%, #d0906a 100%);
    background-attachment: fixed;
    position: relative;
    min-height: 100vh;
  }

  /* 夜色阶段背景叠加（暖黄主调 + 一点粉色） */
  .night-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(255, 200, 100, 0.55), transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(255, 170, 200, 0.40), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(255, 214, 160, 0.40), transparent 55%),
      radial-gradient(ellipse at 50% 30%, rgba(255, 230, 180, 0.30), transparent 60%);
    opacity: 0;
    transition: opacity 2.5s ease;
    pointer-events: none;
  }
  body.revealed .night-bg { opacity: 1; }

  /* 星星漂浮 */
  .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 2s ease 1s; }
  body.revealed .stars { opacity: 1; }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  .light-dot {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: floatDot 12s linear infinite;
    filter: blur(0.5px);
  }
  @keyframes floatDot {
    0% { transform: translateY(20vh) translateX(0); opacity: 0; }
    20% { opacity: 0.9; }
    80% { opacity: 0.7; }
    100% { transform: translateY(-120vh) translateX(40px); opacity: 0; }
  }

  /* ============ 黑屏故障阶段 ============ */
  .glitch-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #050308;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    transition: opacity 1.8s ease;
  }
  .glitch-overlay.gone { opacity: 0; pointer-events: none; }

  .glitch-text {
    font-family: "Caveat", "STKaiti", monospace;
    font-size: clamp(16px, 4.5vw, 22px);
    color: #b8336a;
    letter-spacing: 2px;
    line-height: 1.6;
    text-shadow: 0 0 8px rgba(184, 51, 106, 0.6);
    animation: glitch 0.4s steps(2) infinite;
    max-width: 600px;
  }
  @keyframes glitch {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-1px, 1px); }
    50% { transform: translate(1px, -1px); text-shadow: -2px 0 #ff5b8a, 2px 0 #8ecae6; }
    75% { transform: translate(-1px, -1px); }
    100% { transform: translate(1px, 1px); }
  }
  .glitch-hint {
    margin-top: 18px;
    font-family: "Caveat", sans-serif;
    font-size: 14px;
    color: #888;
    letter-spacing: 1px;
  }

  /* 长按进度环 */
  .progress-wrap {
    position: relative;
    width: 160px;
    height: 160px;
    margin-top: 36px;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .progress-wrap.active { opacity: 1; }
  .progress-svg {
    transform: rotate(-90deg);
    width: 100%;
    height: 100%;
  }
  .progress-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.08);
    stroke-width: 6;
  }
  .progress-fg {
    fill: none;
    stroke: var(--pink);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 440;
    stroke-dashoffset: 440;
    transition: stroke-dashoffset 0.1s linear;
    filter: drop-shadow(0 0 8px rgba(255, 138, 175, 0.8));
  }
  .progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #fff;
    font-family: "Caveat", sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-align: center;
    padding: 0 16px;
    line-height: 1.4;
  }
  .progress-percent {
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 4px;
  }

  /* ============ 主舞台 ============ */
  .stage {
    position: relative;
    z-index: 5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 16px 120px;
    text-align: center;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  body.revealed .stage { opacity: 1; }

  .top-tag {
    font-family: "Dancing Script", "Caveat", serif;
    font-weight: 700;
    font-size: clamp(36px, 9vw, 72px);
    letter-spacing: 4px;
    color: #fff0c0;
    margin-bottom: 22px;
    opacity: 0;
    transform: rotate(-1.5deg);
    animation: fadeIn 1.2s ease 0.6s forwards;
    text-shadow:
      0 0 14px rgba(255, 200, 100, 0.7),
      0 0 28px rgba(255, 170, 200, 0.5),
      0 0 50px rgba(255, 200, 100, 0.4);
  }

  /* 名字 - 英文手写 + 发光 */
  .name {
    font-family: "Dancing Script", "Caveat", cursive;
    font-weight: 700;
    font-size: clamp(72px, 20vw, 180px);
    line-height: 1.3;
    background: linear-gradient(90deg, #ffd6a0, #ff8aaf, #e8b339, #ffd6a0);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow:
      0 0 20px rgba(255, 214, 160, 0.6),
      0 0 40px rgba(255, 138, 175, 0.5),
      0 0 80px rgba(232, 179, 57, 0.4);
    animation: glowMove 5s linear infinite, nameIn 2s ease-out both;
    animation-delay: 1.5s, 1.5s;
    letter-spacing: 4px;
    transform: rotate(-1deg);
    min-height: 1.3em;
    padding: 0.15em 0.1em 0.05em;
    margin: -0.15em -0.1em 0;
    opacity: 0;
    overflow: visible;
  }
  @keyframes glowMove { to { background-position: 200% center; } }
  @keyframes nameIn {
    0% { opacity: 0; transform: rotate(-1deg) translateY(30px) scale(0.85); filter: blur(10px); }
    100% { opacity: 1; transform: rotate(-1deg) translateY(0) scale(1); filter: blur(0); }
  }

  /* 祝福语 - 打字机 */
  .wish {
    margin-top: 24px;
    font-family: "Caveat", "Long Cang", "STKaiti", serif;
    font-size: clamp(20px, 5.5vw, 30px);
    color: #fff5e0;
    letter-spacing: 3px;
    opacity: 0;
    transform: rotate(1.2deg);
    max-width: 640px;
    line-height: 1.8;
    text-shadow: 0 0 12px rgba(255, 214, 160, 0.5);
    min-height: 3.6em;
  }
  .wish.show { animation: fadeIn 1s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  .wish .cursor {
    display: inline-block;
    width: 4px;
    background: #ffd6a0;
    margin-left: 4px;
    animation: blink 0.8s step-end infinite;
    vertical-align: middle;
    height: 1em;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .wish br { display: block; }

  /* ============ 蛋糕（手绘 + 立体） ============ */
  .cake-wrap {
    margin-top: 110px;
    position: relative;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  body.cake-visible .cake-wrap { opacity: 1; }
  .cake {
    position: relative;
    width: 240px;
    height: 220px;
    margin: 0 auto;
    filter: drop-shadow(4px 6px 0 rgba(0, 0, 0, 0.4)) drop-shadow(0 0 30px rgba(255, 214, 160, 0.3));
  }
  /* 托盘 */
  .plate {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) rotate(-1deg);
    width: 280px;
    height: 22px;
    background: linear-gradient(180deg, #d9a3b4 0%, #b9788a 100%);
    border: 3px solid var(--ink);
    border-radius: 50% / 100% 100% 0 0;
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
  }
  /* 三层蛋糕 */
  .layer {
    position: absolute;
    left: 50%;
    border: 3px solid var(--ink);
    border-radius: 12px 12px 6px 6px;
    box-shadow: inset 0 -10px 0 rgba(0, 0, 0, 0.18), inset 4px 0 0 rgba(255, 255, 255, 0.25);
  }
  .layer.top {
    width: 120px; height: 60px; bottom: 130px;
    transform: translateX(-50%) rotate(1deg);
    background: linear-gradient(180deg, #fff0f5 0%, #ffd6e0 100%);
  }
  .layer.mid {
    width: 170px; height: 60px; bottom: 70px;
    transform: translateX(-50%) rotate(-0.5deg);
    background: linear-gradient(180deg, #ffe1ec 0%, #ffb6c1 100%);
  }
  .layer.bot {
    width: 220px; height: 60px; bottom: 10px;
    transform: translateX(-50%) rotate(0.5deg);
    background: linear-gradient(180deg, #ffd4c1 0%, #ff9e57 100%);
  }
  /* 顶部糖霜 */
  .layer::before {
    content: "";
    position: absolute;
    top: -5px; left: -3px; right: -3px;
    height: 16px;
    background: repeating-linear-gradient(90deg, #ff8aaf 0 10px, transparent 10px 20px);
    border: 3px solid var(--ink);
    border-radius: 8px 8px 0 0;
  }
  .layer.bot::before { background: repeating-linear-gradient(90deg, #e8b339 0 10px, transparent 10px 20px); }
  .layer.mid::before { background: repeating-linear-gradient(90deg, #c8a2c8 0 10px, transparent 10px 20px); }
  /* 奶油滴 */
  .drip {
    position: absolute;
    top: 8px;
    width: 12px;
    background: #ff8aaf;
    border: 2px solid var(--ink);
    border-top: 0;
    border-radius: 0 0 50% 50%;
  }
  .drip.d1 { left: 18px; height: 16px; }
  .drip.d2 { left: 60px; height: 12px; }
  .drip.d3 { right: 24px; height: 18px; }
  .drip.d4 { right: 70px; height: 14px; }

  /* 蜡烛 - 底部坐在蛋糕顶层之上（顶层顶边在 top:30） */
  .candles {
    position: absolute;
    top: -8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    z-index: 6;
    align-items: flex-end;
    height: 40px;
  }
  .candle {
    position: relative;
    width: 12px;
    height: 40px;
    background:
      linear-gradient(90deg, rgba(0,0,0,0.18) 0%, transparent 22%, transparent 78%, rgba(0,0,0,0.18) 100%),
      linear-gradient(180deg, #fff 0%, #ffd6e0 100%);
    border: 2px solid var(--ink);
    border-radius: 3px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  body.cake-visible .candle.lit {
    opacity: 1;
    transform: translateY(0);
  }
  /* 蜡烛螺旋条纹 */
  .candle::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, transparent 0 4px, rgba(184, 51, 106, 0.45) 4px 7px);
    border-radius: 3px;
    pointer-events: none;
  }
  /* 烛芯 - 从蜡烛顶部伸出，连接火焰底部，消除断层 */
  .wick {
    position: absolute;
    top: -5px;
    left: 50%;
    margin-left: -1px;
    width: 2px;
    height: 7px;
    background: var(--ink);
    border-radius: 1px;
    z-index: 1;
  }
  /* 火焰 - 底部平贴烛芯顶部，用 margin-left 居中避免 transform 冲突 */
  .flame {
    position: absolute;
    top: -22px;
    left: 50%;
    margin-left: -7px;
    width: 14px;
    height: 20px;
    background: radial-gradient(ellipse at 50% 90%, #fff8b0 0%, #ffd54f 35%, #ffb347 65%, #ff7a18 100%);
    border-radius: 50% 50% 40% 40% / 75% 75% 25% 25%;
    transform-origin: bottom center;
    animation: flicker 0.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 14px rgba(255, 180, 71, 0.9)) drop-shadow(0 0 26px rgba(255, 122, 24, 0.5));
    z-index: 2;
  }
  @keyframes flicker {
    0% { transform: scale(0.95, 0.97) rotate(-4deg); }
    100% { transform: scale(1.08, 1.12) rotate(4deg); }
  }
  /* 风吹时火焰倾斜 */
  .candles.windy .flame {
    animation: windFlicker 0.18s ease-in-out infinite alternate;
  }
  @keyframes windFlicker {
    0% { transform: scale(0.85, 0.9) rotate(28deg); }
    100% { transform: scale(1, 1) rotate(42deg); }
  }
  /* 蜡烛吹灭状态 */
  .candle.out .flame { opacity: 0; transform: scale(0); transition: all 0.4s ease; filter: none; }
  .candle.out .wick { opacity: 0.5; }
  .smoke {
    position: absolute;
    top: -26px;
    left: 50%;
    margin-left: -5px;
    width: 10px;
    height: 10px;
    background: rgba(180, 180, 180, 0.7);
    border-radius: 50%;
    opacity: 0;
  }
  .candle.out .smoke { animation: smokeUp 1.2s ease-out forwards; }
  @keyframes smokeUp {
    0% { opacity: 0.8; transform: translate(0, 0) scale(0.5); }
    100% { opacity: 0; transform: translate(20px, -50px) scale(3); }
  }

  /* 风的视觉动画 - 半透明白色波浪扫过蜡烛区 */
  .wind-gust {
    position: absolute;
    top: -50px;
    left: -120%;
    width: 80%;
    height: 80px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.5) 45%, rgba(255,255,255,0.7) 55%, transparent 100%);
    border-radius: 50%;
    filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    z-index: 7;
  }
  .wind-gust.blow {
    animation: gust 1.2s ease-out forwards;
  }
  @keyframes gust {
    0% { left: -120%; opacity: 0; }
    20% { opacity: 0.9; }
    80% { opacity: 0.7; }
    100% { left: 120%; opacity: 0; }
  }

  /* 底部按钮 - 拆礼物 */
  .btn-gifts {
    margin-top: 36px;
    padding: 14px 38px;
    border: 3px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 20px;
    letter-spacing: 4px;
    color: #fff;
    background: linear-gradient(135deg, #ff6b9d, #b8336a);
    box-shadow: 4px 4px 0 var(--ink), 0 0 24px rgba(255, 107, 157, 0.6);
    cursor: pointer;
    opacity: 0;
    transform: translateY(20px) rotate(-1deg);
    transition: opacity 0.6s ease, transform 0.2s ease, box-shadow 0.2s ease;
    animation: btnPulse 2s ease-in-out infinite;
  }
  body.revealed .btn-gifts.show { opacity: 1; transform: translateY(0) rotate(-1deg); }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 4px 4px 0 var(--ink), 0 0 24px rgba(255, 107, 157, 0.6); }
    50% { box-shadow: 4px 4px 0 var(--ink), 0 0 40px rgba(255, 107, 157, 0.9); }
  }
  .btn-gifts:hover { transform: translateY(-2px) rotate(-1deg); box-shadow: 6px 6px 0 var(--ink), 0 0 40px rgba(255, 107, 157, 0.9); }
  .btn-gifts:active { transform: translateY(2px) rotate(-1deg); box-shadow: 1px 1px 0 var(--ink); }
  .btn-gifts.hidden { display: none; }

  /* 蜡烛按钮 */
  .btn-blow {
    margin-top: 24px;
    padding: 10px 26px;
    border: 3px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    font-family: "ZCOOL KuaiLe", sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    color: #fff;
    background: linear-gradient(135deg, #e8b339, #ff9e57);
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.15s ease;
  }
  body.revealed .btn-blow.show { opacity: 1; }
  .btn-blow:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  /* ============ 礼物盒区 ============ */
  .gifts-stage {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .gifts-stage.show { opacity: 1; pointer-events: auto; }

  .gift-box {
    --rot: 0deg;
    position: absolute;
    width: 130px;
    height: 160px;
    cursor: pointer;
    z-index: 11;
    transition: transform 0.3s ease;
    filter: drop-shadow(4px 6px 0 rgba(0, 0, 0, 0.3));
    transform: rotate(var(--rot));
  }
  .gift-box.medium { width: 100px; height: 122px; }
  .gift-box.medium .bow { width: 44px; height: 24px; top: -16%; }
  .gift-box.medium .bow::before, .gift-box.medium .bow::after { width: 22px; height: 22px; }
  .gift-box.medium .bow-center { width: 11px; height: 18px; }
  .gift-box.medium .gift-num { width: 34px; height: 34px; line-height: 28px; font-size: 18px; top: -32px; }
  .gift-box.medium .ribbon-v { width: 14px; }
  .gift-box.medium .ribbon-h { height: 14px; }
  .gift-box.medium .lid::before { height: 14px; }
  .gift-box:hover { transform: scale(1.08) rotate(var(--rot)); }

  /* 盒身（立体效果） */
  .box-body {
    position: absolute;
    top: 28%;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--c, var(--pink));
    border: 3px solid var(--ink);
    border-radius: 6px 6px 10px 10px;
    box-shadow:
      inset 0 -14px 0 rgba(0, 0, 0, 0.22),
      inset 6px 0 0 rgba(255, 255, 255, 0.2),
      inset -6px 0 0 rgba(0, 0, 0, 0.15);
  }
  .box-body::after {
    /* 立体侧面 */
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: -8px;
    width: 8px;
    background: rgba(0, 0, 0, 0.2);
    border: 3px solid var(--ink);
    border-left: 0;
    border-radius: 0 6px 10px 0;
  }
  /* 竖丝带 */
  .ribbon-v {
    position: absolute;
    top: 28%;
    bottom: 0;
    left: 50%;
    width: 18px;
    background: var(--rc, var(--gold));
    border-left: 3px solid var(--ink);
    border-right: 3px solid var(--ink);
    transform: translateX(-50%);
    z-index: 2;
    box-shadow: inset 0 -14px 0 rgba(0, 0, 0, 0.15);
  }
  /* 横丝带 */
  .ribbon-h {
    position: absolute;
    top: 55%;
    left: 0;
    right: 0;
    height: 18px;
    background: var(--rc, var(--gold));
    border-top: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    z-index: 2;
  }
  /* 盒盖 */
  .lid {
    position: absolute;
    top: 0;
    left: -10%;
    right: -10%;
    height: 30%;
    background: var(--c, var(--pink));
    border: 3px solid var(--ink);
    border-radius: 6px;
    box-shadow:
      inset 0 -6px 0 rgba(0, 0, 0, 0.2),
      inset 6px 0 0 rgba(255, 255, 255, 0.2);
    transform-origin: bottom center;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
    z-index: 3;
  }
  .lid::before {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 18px;
    background: var(--rc, var(--gold));
    border-top: 3px solid var(--ink);
  }
  /* 蝴蝶结 */
  .bow {
    position: absolute;
    top: -18%;
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 30px;
    z-index: 4;
  }
  .bow::before, .bow::after {
    content: "";
    position: absolute;
    top: 0;
    width: 28px;
    height: 28px;
    background: var(--rc, var(--gold));
    border: 3px solid var(--ink);
    border-radius: 50% 50% 50% 8%;
  }
  .bow::before { left: -12px; transform: rotate(-30deg); }
  .bow::after { right: -12px; transform: rotate(30deg) scaleX(-1); }
  .bow-center {
    position: absolute;

<script>
(function () {
  /* ============ 星星 / 光点 ============ */
  var stars = document.getElementById('stars');
  for (var i = 0; i < 60; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var sz = 1 + Math.random() * 2.5;
    s.style.width = sz + 'px';
    s.style.height = sz + 'px';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.opacity = 0.4 + Math.random() * 0.6;
    stars.appendChild(s);
  }
  var dotColors = ['#ffd6a0','#ff8aaf','#e8b339','#c8a2c8','#8ecae6'];
  for (var j = 0; j < 18; j++) {
    var d = document.createElement('div');
    d.className = 'light-dot';
    var sz = 4 + Math.random() * 8;
    d.style.width = sz + 'px';
    d.style.height = sz + 'px';
    d.style.background = dotColors[Math.floor(Math.random() * dotColors.length)];
    d.style.left = Math.random() * 100 + '%';
    d.style.bottom = (-10 - Math.random() * 20) + 'vh';
    d.style.animationDelay = (Math.random() * 12) + 's';
    d.style.animationDuration = (10 + Math.random() * 8) + 's';
    d.style.boxShadow = '0 0 12px ' + d.style.background;
    stars.appendChild(d);
  }

  /* ============ Web Audio 引擎 ============ */
  var audioCtx = null;
  var musicGain = null;
  var bgPlaying = false;
  var bgTimer = null;

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.42;
      musicGain.connect(audioCtx.destination);
    } catch (e) {}
  }

  var NOTES = {
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
    G4: 392.00, A4: 440.00, B4: 493.88, C5: 523.25, Bb4: 466.16
  };
  var MELODY = [
    ['C4', 0.75], ['C4', 0.25], ['D4', 1], ['C4', 1], ['F4', 1], ['E4', 2],
    ['C4', 0.75], ['C4', 0.25], ['D4', 1], ['C4', 1], ['G4', 1], ['F4', 2],
    ['C4', 0.75], ['C4', 0.25], ['C5', 1], ['A4', 1], ['F4', 1], ['E4', 1], ['D4', 2],
    ['Bb4', 0.75], ['Bb4', 0.25], ['A4', 1], ['F4', 1], ['G4', 1], ['F4', 2]
  ];
  var BEAT = 0.42;

  function playNote(freq, startTime, dur) {
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.32, startTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.18, startTime + 0.12);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
    osc.connect(gain);
    gain.connect(musicGain);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.05);
    var osc2 = audioCtx.createOscillator();
    var gain2 = audioCtx.createGain();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2;
    gain2.gain.setValueAtTime(0, startTime);
    gain2.gain.linearRampToValueAtTime(0.08, startTime + 0.03);
    gain2.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
    osc2.connect(gain2);
    gain2.connect(musicGain);
    osc2.start(startTime);
    osc2.stop(startTime + dur + 0.05);
  }

  function playBgMusic() {
    if (!audioCtx || bgPlaying) return;
    bgPlaying = true;
    var loopDur = MELODY.reduce(function (s, n) { return s + n[1] * BEAT; }, 0);
    function scheduleLoop() {
      if (!bgPlaying) return;
      var t = audioCtx.currentTime + 0.05;
      MELODY.forEach(function (pair) {
        var note = pair[0], beats = pair[1];
        playNote(NOTES[note], t, beats * BEAT * 0.95);
        t += beats * BEAT;
      });
      bgTimer = setTimeout(scheduleLoop, loopDur * 1000);
    }
    scheduleLoop();
  }

  // 拆礼物音效 - 柔和的纸张沙沙声（滤波白噪声）
  function playOpenSound() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var dur = 0.6;
    // 生成白噪声 buffer
    var bufSize = audioCtx.sampleRate * dur;
    var buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufSize; i++) {
      // 沙沙声：随机噪声 + 慢调制
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize) * 0.5;
    }
    var noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    // 高通滤波 -> 像纸张摩擦
    var hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 2000;
    // 带通让声音更柔和
    var bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 4000;
    bp.Q.value = 0.8;
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.18, t + 0.05);
    gain.gain.linearRampToValueAtTime(0.14, t + 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(hp); hp.connect(bp); bp.connect(gain); gain.connect(audioCtx.destination);
    noise.start(t); noise.stop(t + dur);
  }

  function playDingSound() {
    if (!audioCtx) return;
    var freqs = [880, 1318.5, 1760];
    freqs.forEach(function (f, idx) {
      var t = audioCtx.currentTime + idx * 0.06;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.65);
    });
  }

  // 蜡烛点亮音效（小的"啵"）
  function playCandleSound() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, t);
    osc.frequency.exponentialRampToValueAtTime(1200, t + 0.08);
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.18);
  }

  // 吹蜡烛"呼"音效 - 低频呼气声（白噪声 + 低通滤波 + 渐弱）
  function playBlowSound() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime;
    var dur = 1.0;
    var bufSize = audioCtx.sampleRate * dur;
    var buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < bufSize; i++) {
      // 呼气：噪声 + 中段渐强再弱
      var env = Math.sin(Math.PI * (i / bufSize)); // 0→1→0
      data[i] = (Math.random() * 2 - 1) * env;
    }
    var noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    // 低通滤波模拟气流
    var lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1200, t);
    lp.frequency.exponentialRampToValueAtTime(500, t + dur);
    var gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.35, t + 0.15);
    gain.gain.linearRampToValueAtTime(0.25, t + 0.5);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(lp); lp.connect(gain); gain.connect(audioCtx.destination);
    noise.start(t); noise.stop(t + dur);
  }

  /* ============ 黑屏故障 + 长按修复 ============ */
  var glitchOverlay = document.getElementById('glitchOverlay');
  var glitchText = document.getElementById('glitchText');
  var glitchHint = document.getElementById('glitchHint');
  var progressWrap = document.getElementById('progressWrap');
  var progressFg = document.getElementById('progressFg');
  var progressPercent = document.getElementById('progressPercent');
  var progressMsg = document.getElementById('progressMsg');
  var CIRC = 2 * Math.PI * 70;

  var PROGRESS_MSGS = [
    { p: 0, msg: '准备修复…' },
    { p: 15, msg: '正在修复页面…' },
    { p: 35, msg: '检测到异常情绪数据…' },
    { p: 60, msg: '发现一个必须庆祝的日子…' },
    { p: 85, msg: '正在加载惊喜…' },
    { p: 100, msg: '完成 ✨' }
  ];

  var pressing = false;
  var pressStart = 0;
  var pressTimer = null;
  var HOLD_MS = 3000;
  var revealed = false;

  function updateProgress(ratio) {
    var pct = Math.min(100, Math.floor(ratio * 100));
    progressPercent.textContent = pct + '%';
    progressFg.style.strokeDashoffset = CIRC * (1 - ratio);
    // 选当前 msg
    var cur = PROGRESS_MSGS[0];
    for (var i = 0; i < PROGRESS_MSGS.length; i++) {
      if (pct >= PROGRESS_MSGS[i].p) cur = PROGRESS_MSGS[i];
    }
    progressMsg.textContent = cur.msg;
  }

  function startPress(e) {
    if (revealed || pressing) return;
    pressing = true;
    pressStart = Date.now();
    glitchText.style.display = 'none';
    glitchHint.style.display = 'none';
    progressWrap.classList.add('active');
    // 初始化音频（用户首次交互）
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    function loop() {
      if (!pressing) return;
      var elapsed = Date.now() - pressStart;
      var ratio = Math.min(1, elapsed / HOLD_MS);
      updateProgress(ratio);
      if (ratio >= 1) {
        pressing = false;
        revealScene();
        return;
      }
      pressTimer = requestAnimationFrame(loop);
    }
    loop();
  }

  function endPress() {
    if (revealed) return;
    pressing = false;
    if (pressTimer) cancelAnimationFrame(pressTimer);
    // 渐退到 0
    var pct = 0;
    progressPercent.textContent = '0%';
    progressFg.style.strokeDashoffset = CIRC;
    progressMsg.textContent = '准备修复…';
    setTimeout(function () {
      if (!revealed) {
        progressWrap.classList.remove('active');
        glitchText.style.display = '';
        glitchHint.style.display = '';
      }
    }, 200);
  }

  // 鼠标长按
  glitchOverlay.addEventListener('mousedown', function (e) { e.preventDefault(); startPress(e); });
  glitchOverlay.addEventListener('mouseup', endPress);
  glitchOverlay.addEventListener('mouseleave', endPress);
  // 触摸长按
  glitchOverlay.addEventListener('touchstart', function (e) { e.preventDefault(); startPress(e); }, { passive: false });
  glitchOverlay.addEventListener('touchend', endPress);
  glitchOverlay.addEventListener('touchcancel', endPress);

  /* ============ 揭晓场景 ============ */
  function revealScene() {
    if (revealed) return;
    revealed = true;

    // 1. 黑屏 overlay 渐隐
    glitchOverlay.classList.add('gone');

    // 2. body revealed - 显示夜色背景 + 蛋糕容器
    setTimeout(function () {
      document.body.classList.add('revealed');
    }, 200);

    // 3. 启动背景音乐（用户已交互过，可以直接播）
    setTimeout(function () {
      playBgMusic();
    }, 400);

    // 4. 蛋糕出现，蜡烛逐根点亮
    setTimeout(function () {
      document.body.classList.add('cake-visible');
      var candles = document.querySelectorAll('#candles .candle');
      candles.forEach(function (c, idx) {
        setTimeout(function () {
          c.classList.add('lit');
          playCandleSound();
        }, idx * 350);
      });
    }, 1500);

    // 5. 名字淡入（CSS 自带 animation-delay 1.5s 相对 revealed 时间）
    // 名字打字机在 revealed 后 2.5 秒开始
    setTimeout(function () {
      typeWriterName();
    }, 2500);

    // 6. 祝福语打字机（名字写完后开始）
    setTimeout(function () {
      var wishEl = document.getElementById('wish');
      wishEl.classList.add('show');
      typeWriterWish();
    }, 4600);

    // 7. 吹蜡烛按钮 + 拆礼物按钮显示
    setTimeout(function () {
      document.getElementById('blowBtn').classList.add('show');
    }, 7500);
    setTimeout(function () {
      document.getElementById('giftsBtn').classList.add('show');
    }, 8500);

    // 8. 蛋糕出现后开始彩纸
    setTimeout(function () {
      spawnConfetti(30);
    }, 2000);

    // 9. 烟花
    startFireworks();
  }

  /* ============ 名字打字机 ============ */
  var nameEl = document.getElementById('name');
  var fullName = 'LilyCao';
  function typeWriterName() {
    var i = 0;
    function step() {
      if (i <= fullName.length) {
        nameEl.innerHTML = fullName.slice(0, i) + '<span class="cursor"></span>';
        i++;
        setTimeout(step, 200);
      } else {
        setTimeout(function () { nameEl.innerHTML = fullName; }, 1000);
      }
    }
    step();
  }

  /* ============ 祝福语打字机（带换行） ============ */
  var wishEl = document.getElementById('wish');
  var wishText = '祝你生日快乐！\n愿你的每一天，都像今天一样被照亮。';
  function typeWriterWish() {
    var i = 0;
    function step() {
      if (i <= wishText.length) {
        var slice = wishText.slice(0, i);
        var html = slice
          .replace(/\n/g, '<br>')
          + '<span class="cursor"></span>';
        wishEl.innerHTML = html;
        i++;
        // 标点稍长停顿
        var ch = wishText.charAt(i - 1);
        var delay = (ch === '！' || ch === '。' || ch === '\n') ? 350 : 110;
        setTimeout(step, delay);
      } else {
        setTimeout(function () {
          wishEl.innerHTML = wishText.replace(/\n/g, '<br>');
        }, 1000);
      }
    }
    step();
  }

  /* ============ 彩纸 ============ */
  var COLORS = ['#ff6b9d','#b8336a','#e8b339','#c8a2c8','#ffb6c1','#88c9a1','#8ecae6','#ff9e57','#ffd6a0'];
  function spawnConfetti(count) {
    for (var k = 0; k < count; k++) {
      var c = document.createElement('div');
      c.className = 'confetti';
      var size = 8 + Math.random() * 12;
      c.style.width = size + 'px';
      c.style.height = (size * 1.3) + 'px';
      c.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      var dur = 3 + Math.random() * 3;
      c.style.transition = 'transform ' + dur + 's linear, opacity ' + dur + 's ease';
      document.body.appendChild(c);
      var rot = Math.random() * 720 - 360;
      requestAnimationFrame(function () {
        c.style.transform = 'translateY(' + (window.innerHeight + 40) + 'px) rotate(' + rot + 'deg)';
        c.style.opacity = 0;
      });
      (function (el, d) { setTimeout(function () { el.remove(); }, d * 1000 + 200); })(c, dur);
    }
  }
  // 蛋糕出现后持续小量彩纸
  setInterval(function () {
    if (revealed) spawnConfetti(5);
  }, 1500);

  /* ============ 烟花 ============ */
  var canvas = document.getElementById('fireworks');
  var ctx = canvas.getContext('2d');
  var particles = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function launchFirework(x, y) {
    var cx = x != null ? x : Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
    var cy = y != null ? y : Math.random() * canvas.height * 0.4 + 80;
    var hue = Math.floor(Math.random() * 360);
    var count = 50 + Math.floor(Math.random() * 30);
    for (var n = 0; n < count; n++) {
      var angle = (Math.PI * 2 * n) / count;
      var speed = 2 + Math.random() * 4;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.012 + Math.random() * 0.02,
        color: 'hsl(' + (hue + Math.random() * 40 - 20) + ', 90%, 60%)',
        size: 2 + Math.random() * 2
      });
    }
  }

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx;
      pt.y += pt.vy;
      pt.vy += 0.03;
      pt.vx *= 0.99;
      pt.life -= pt.decay;
      if (pt.life <= 0) { particles.splice(p, 1); continue; }
      ctx.globalAlpha = Math.max(pt.life, 0);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();

  var fwTimer = null;
  function startFireworks() {
    fwTimer = setTimeout(function boom() {
      launchFirework();
      fwTimer = setTimeout(boom, 1800 + Math.random() * 1200);
    }, 1500);
  }

  /* ============ 吹蜡烛 ============ */
  var btnBlow = document.getElementById('blowBtn');
  var candles = document.querySelectorAll('#candles .candle');
  var candlesWrap = document.getElementById('candles');
  var windGust = document.getElementById('windGust');
  var blown = false;
  btnBlow.addEventListener('click', function () {
    if (blown) {
      candles.forEach(function (c) { c.classList.remove('out'); });
      candlesWrap.classList.remove('windy');
      btnBlow.textContent = '点击吹蜡烛';
      blown = false;
      return;
    }
    blown = true;
    // 播放"呼"音效
    playBlowSound();
    // 火焰被风吹得倾斜
    candlesWrap.classList.add('windy');
    // 风的视觉波浪扫过
    windGust.classList.remove('blow');
    void windGust.offsetWidth; // 重置动画
    windGust.classList.add('blow');
    // 蜡烛逐根熄灭（被风吹灭）
    candles.forEach(function (c, idx) {
      setTimeout(function () { c.classList.add('out'); }, 300 + idx * 130);
    });
    setTimeout(function () {
      candlesWrap.classList.remove('windy');
      launchFirework(window.innerWidth * 0.3, window.innerHeight * 0.35);
      launchFirework(window.innerWidth * 0.7, window.innerHeight * 0.4);
      spawnConfetti(60);
      btnBlow.textContent = '再点一次烛';
    }, 1100);
  });

  /* ============ 拆礼物按钮 + 礼物盒区 ============ */
  var giftsBtn = document.getElementById('giftsBtn');
  var giftsStage = document.getElementById('giftsStage');
  var giftsShown = false;
  giftsBtn.addEventListener('click', function () {
    if (!giftsShown) {
      giftsShown = true;
      giftsStage.classList.add('show');
      giftsBtn.textContent = '收起礼物';
      // 礼物盒浮现时来一波彩纸
      spawnConfetti(40);
    } else {
      giftsShown = false;
      giftsStage.classList.remove('show');
      giftsBtn.textContent = '请拆礼物吧';
    }
  });

  /* ============ 礼物按点击顺序 ============ */
  var GIFTS = [
    '你的小鱼会茁壮成长 🐟',
    '你的花花草草会红红绿绿 🌷',
    '黄金大涨！！！💰',
    '新的一年可以多出去玩哦 ✈️',
    '身体健康最重要 ❤️',
    '我爱你呀！！！💕'
  ];
  var clickOrder = 0;
  var openedIds = {};
  var giftMask = document.getElementById('giftMask');
  var giftText = document.getElementById('giftText');
  var giftTag = document.getElementById('giftTag');
  var gotCountEl = document.getElementById('gotCount');
  var closeGift = document.getElementById('closeGift');

  var largeBoxes = document.querySelectorAll('.gifts-stage .gift-box:not(.small)');
  largeBoxes.forEach(function (box) {
    box.addEventListener('click', function () {
      var id = box.getAttribute('data-id');
      if (openedIds[id]) return;
      if (clickOrder >= GIFTS.length) return;

      playOpenSound();
      box.classList.add('opened');
      openedIds[id] = true;

      var giftIndex = clickOrder;
      var giftContent = GIFTS[giftIndex];
      clickOrder++;

      setTimeout(function () {
        playDingSound();
        giftTag.textContent = '第 ' + (giftIndex + 1) + ' 份礼物';
        var numEl = box.querySelector('.gift-num');
        if (numEl) numEl.textContent = giftIndex + 1;
        giftText.textContent = '';
        typeText(giftText, giftContent, 0, function () {
          spawnConfetti(20);
        });
        gotCountEl.textContent = clickOrder;
        giftMask.classList.add('show');

        if (clickOrder === GIFTS.length) {
          setTimeout(function () {
            launchFirework(window.innerWidth * 0.3, window.innerHeight * 0.35);
            launchFirework(window.innerWidth * 0.7, window.innerHeight * 0.4);
            launchFirework(window.innerWidth * 0.5, window.innerHeight * 0.25);
            spawnConfetti(80);
          }, 800);
        }
      }, 450);
    });
  });

  function typeText(el, text, idx, done) {
    if (idx <= text.length) {
      el.textContent = text.slice(0, idx);
      setTimeout(function () { typeText(el, text, idx + 1, done); }, 60);
    } else if (typeof done === 'function') {
      done();
    }
  }

  closeGift.addEventListener('click', function () {
    giftMask.classList.remove('show');
  });
  giftMask.addEventListener('click', function (e) {
    if (e.target === giftMask) giftMask.classList.remove('show');
  });
})();
</script>
</body>
